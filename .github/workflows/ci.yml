# GitHub Actions for most-exchange -- the mirror of .gitlab-ci.yml, which stays the primary pipeline.
#
# Same purpose: the three proofs the project owns run without anybody remembering them.
#
#   * **zero allocation** -- AllocationTest and AeronAllocationTest, inside `test-core`.
#   * **the wire** -- `e2e/run-e2e.sh`.
#   * **durability** -- `e2e/run-restart.sh`.
#
# Differences from GitLab, and why:
#   * `publish-sdk` publishes to GitHub Packages, not the GitLab registry: only from a manual dispatch
#     with `publish` ticked, on master or a tag, after the same jobs GitLab's `publish:sdk` waits for.
#     A publish is a release decision. Reading the package back needs a token with `read:packages`,
#     even though the package is public (docs/Adapters.md §0).
#   * `test-control` needs no dind: a hosted Ubuntu runner has a Docker daemon of its own, and
#     Testcontainers finds it with no overrides.
#   * The measurement jobs run only from a manual dispatch with `measure` ticked. A hosted runner is
#     a shared VM -- a shape check, never a number to quote (docs/Measurements.md).
#   * `test:web`'s `changes:` rule has no per-job equivalent here without a third-party action; the
#     job is cheap, so it always runs.

name: CI

on:
  push:
    branches: [master]
    tags: ["*"]
  pull_request:
  workflow_dispatch:
    inputs:
      measure:
        description: "Also run the sweep and attribution (shape check only)"
        type: boolean
        default: false
      publish:
        description: "Publish the SDK (sbe, client) to GitHub Packages at sdk.version -- master or a tag only"
        type: boolean
        default: false

# One run per ref; a newer push supersedes an older one (GitLab's `interruptible`).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------- build

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assemble installDist
      # upload-artifact drops the executable bit, and the e2e scripts run bin/ launchers directly,
      # so the distributions travel as a tarball.
      - run: tar -cf dists.tar */build/install/
      - uses: actions/upload-artifact@v4
        with:
          name: dists
          path: dists.tar
          retention-days: 1

  # ----------------------------------------------------------------------------- test

  test-core:
    # Everything except control, so a Docker problem cannot stop the engine's proofs from running.
    # AllocationTest and AeronAllocationTest are timing-sensitive by design; if one flakes here, the
    # fix is more rounds in the test, never a wider tolerance (CLAUDE.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test -x :control:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-core-reports
          path: |
            */build/test-results/test/TEST-*.xml
            */build/reports/tests/
          retention-days: 7

  test-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :control:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-control-reports
          path: |
            control/build/test-results/test/TEST-*.xml
            control/build/reports/tests/
          retention-days: 7

  test-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # `build` runs vue-tsc --noEmit first, so this is the type check as well as the bundle.
      - run: npm run build

  # --------------------------------------------------------------------------- verify

  e2e:
    # The wire check. Run after anything that crosses a process boundary.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@v4
        with:
          name: dists
      - run: tar -xf dists.tar
      - run: ./e2e/run-e2e.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-logs
          path: build/e2e/logs/
          retention-days: 7

  e2e-restart:
    # Durability: rests orders, snapshots, stops the node and brings it back across geometry
    # changes. Slower than it looks -- each restart waits out the ~10 s mark-file window.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@v4
        with:
          name: dists
      - run: tar -xf dists.tar
      - run: ./e2e/run-restart.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-restart-logs
          path: build/e2e-restart/logs/
          retention-days: 7

  native-engine:
    # Slow, so only on the default branch, a tag, or a manual dispatch -- not on every pull request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Design.md §7: pin -march explicitly. -march=native SIGILLs when the build host's CPU differs
      # from production, which is exactly what a hosted runner guarantees.
      ENGINE_MARCH: x86-64-v3
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :engine:nativeCompile -Pengine.march=$ENGINE_MARCH
      # A missing --add-exports=java.base/jdk.internal.misc=ALL-UNNAMED does NOT fail the build; it
      # silently omits the class and the binary dies on its first UnsafeBuffer. This grep is the only
      # check that works on an image you cannot run: 0 when the exports were dropped, 3 when they
      # were not (CLAUDE.md, "Build and deployment").
      - name: Check the image kept jdk.internal.misc.Unsafe
        run: |
          BIN=engine/build/native/nativeCompile/matching-engine
          test -x "$BIN" || { echo "no binary produced"; exit 1; }
          COUNT=$(grep -c 'jdk.internal.misc.Unsafe' "$BIN" || true)
          echo "jdk.internal.misc.Unsafe references in the image: $COUNT (expected 3, must not be 0)"
          test "$COUNT" -gt 0 || { echo "FAIL: the --add-exports were dropped from the native build"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: matching-engine
          path: engine/build/native/nativeCompile/matching-engine
          retention-days: 7

  # -------------------------------------------------------------------------- publish

  publish-sdk:
    # The adapter SDK -- `sbe` and `client`, Apache-2.0 -- at `sdk.version` in gradle.properties. A
    # `-SNAPSHOT` version may be republished; GitHub Packages refuses a duplicate release version.
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    needs: [build, test-core]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :sbe:publishSdkPublicationToGithubRepository :client:publishSdkPublicationToGithubRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------------- measure

  measure-sweep:
    if: github.event_name == 'workflow_dispatch' && inputs.measure
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Smaller than the default 300k: a shape check, not a capacity plan.
      ORDERS: "100000"
      WARMUP_ORDERS: "50000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@v4
        with:
          name: dists
      - run: tar -xf dists.tar
      - run: ./e2e/run-sweep.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep
          path: build/sweep/
          retention-days: 7

  measure-attribution:
    if: github.event_name == 'workflow_dispatch' && inputs.measure
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORDERS: "500000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@v4
        with:
          name: dists
      - run: tar -xf dists.tar
      - run: ./e2e/run-attribution.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attribution
          path: |
            build/attribution/*.hgrm
            build/attribution/logs/
          retention-days: 30
