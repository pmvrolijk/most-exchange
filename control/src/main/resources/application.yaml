# The control plane authors reference data; it is deliberately NOT on the boot path of the engine,
# gateway, market-data or discovery. Those read published files, so this database can be down and
# the cluster still starts.

spring:
  application:
    name: control
  datasource:
    url: ${CONTROL_DB_URL:jdbc:postgresql://localhost:5432/most_control}
    username: ${CONTROL_DB_USER:most}
    password: ${CONTROL_DB_PASSWORD:most}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${CONTROL_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        # Lax, not Strict: the session cookie must survive a top-level navigation back into the SPA.
        # It is a second line behind CSRF tokens, not the defence itself.
        same-site: lax
        # Off in development, since the Vite dev server and the API are both plain HTTP on
        # localhost. Any real deployment terminates TLS and must set this true.
        secure: ${CONTROL_COOKIE_SECURE:false}

control:
  # The first operator account, seeded once into an empty control_user table. With no password set
  # the control plane generates one and prints it at WARN on first boot -- a known default password
  # on something that can open a market would be worse than no authentication at all, because it
  # would look protected.
  auth:
    adminUser: ${CONTROL_ADMIN_USER:admin}
    adminPassword: ${CONTROL_ADMIN_PASSWORD:}

  # Where published releases are written. Each publish creates an immutable numbered subdirectory;
  # deployments point engine.securitiesFile and friends at one of them.
  releaseDir: ${CONTROL_RELEASE_DIR:./build/releases}

  # The live link to a running exchange: operator commands out, book events in. Optional -- with no
  # media driver the REST API still serves and /api/status says why the link is down. Authoring
  # reference data must never require an Aeron driver.
  aeron:
    enabled: ${CONTROL_AERON_ENABLED:true}
    dir: ${CONTROL_AERON_DIR:}
  discovery:
    channel: ${CONTROL_DISCOVERY_CHANNEL:aeron:udp?endpoint=239.10.0.1:40000}
    streamId: ${CONTROL_DISCOVERY_STREAM:100}
  # L3, not L1 or L2: a volatility halt is only visible on the raw book event stream.
  l3:
    channel: ${CONTROL_L3_CHANNEL:aeron:udp?endpoint=239.10.1.3:40003}
    streamId: ${CONTROL_L3_STREAM:3}
  # L2 and the recovery feed, which the console's books are rebuilt from. Both or neither: the
  # increments cannot be applied without an image, and an image goes stale without the increments.
  l2:
    channel: ${CONTROL_L2_CHANNEL:aeron:udp?endpoint=239.10.1.2:40002}
    streamId: ${CONTROL_L2_STREAM:2}
  snapshot:
    channel: ${CONTROL_SNAPSHOT_CHANNEL:aeron:udp?endpoint=239.10.1.4:40004}
    streamId: ${CONTROL_SNAPSHOT_STREAM:4}
  # L1 for LastTrade. A snapshot carries the last trade only for a subscriber that is still
  # joining -- a synchronised one ignores snapshots -- so without L1 a book would trade on screen
  # while its last price stayed empty.
  l1:
    channel: ${CONTROL_L1_CHANNEL:aeron:udp?endpoint=239.10.1.1:40001}
    streamId: ${CONTROL_L1_STREAM:1}
  # How often a book image is built and pushed. Conflation, not streaming: the feed can carry 100k
  # updates a second and an operator can read about four, so everything in between folds into the
  # next image. It also keeps a browser off the feed's critical path entirely.
  depth:
    publishMs: ${CONTROL_DEPTH_PUBLISH_MS:250}
    maxLevels: ${CONTROL_DEPTH_MAX_LEVELS:25}

  # The shard's CLUSTER ingress, which is the one thing the control plane does not reach through
  # the gateway: a snapshot is a cluster admin request, not a message for the log. Deliberately
  # here in this process's own configuration rather than in the database or the discovery
  # broadcast -- a release carries topology, deployment stays per process, and keeping cluster
  # ingress out of the directory is what stops an upstream adapter finding the cluster and
  # skipping the gateway's validation.
  #
  # Aeron member-endpoint form, per shard: `0=host:port`, comma-separated across members so the
  # client can find the leader. A shard with no entry simply cannot be snapshotted from here, and
  # the API says so rather than failing obscurely.
  # Set control.cluster.ingress.<shardId>, or CONTROL_CLUSTER_INGRESS_<shardId> in the environment.
  # Not declared here: the keys are looked up per shard rather than bound as a map, so a shard needs
  # no entry in this file to be configurable.
  #
  # A node running with a participant registry refuses a session with no credentials, so this
  # process then names itself with an operator-only entry of that shard's registry (Design.md §1):
  # control.cluster.identity.<shardId> (CONTROL_CLUSTER_IDENTITY_<shardId>) and
  # control.cluster.secretFile.<shardId> (CONTROL_CLUSTER_SECRETFILE_<shardId>), both or neither.
  # The secret is read from the file only.
  cluster:
    ingressChannel: ${CONTROL_CLUSTER_INGRESS_CHANNEL:aeron:udp}
    egressChannel: ${CONTROL_CLUSTER_EGRESS_CHANNEL:aeron:udp?endpoint=0.0.0.0:0}

  # Session scheduling. Every tick reconciles the phase the calendar says a shard should be in
  # against the phase L3 says it is in, and sends the difference -- so it is idempotent, recovers
  # by itself after an outage, and keeps no missed-timer state. It never reopens a halted security:
  # recovery is operator-driven by design.
  scheduler:
    enabled: ${CONTROL_SCHEDULER_ENABLED:true}
    intervalMs: ${CONTROL_SCHEDULER_INTERVAL_MS:5000}
