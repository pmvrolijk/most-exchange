# The tradable universe: which security lives on which shard, and how to reach that shard.
#
# Derived from the shards' OWN security files, so the published directory and the running engines
# cannot describe different geometry.

discovery.shards=0
discovery.shard.0.securitiesFile=/config/shard-0-securities.properties

# The GATEWAY's client endpoints, not the cluster's ingress. An adapter that connected to the
# cluster directly would bypass the validation and cumQty reconstruction the gateway exists for.
# These must match gateway.properties exactly.
discovery.shard.0.orderEntryChannel=aeron:udp?endpoint=shard0:20001
discovery.shard.0.orderEntryStreamId=20
# Note the asymmetry with gateway.properties, which is correct rather than a mistake: what the
# gateway PUBLISHES on is `control=...|control-mode=dynamic` with no endpoint, because an MDC
# publication must not name one. What a subscriber needs is the same control address plus an
# endpoint of its own. The directory's job is to tell a client how to subscribe, so it carries the
# subscriber form; `endpoint=0.0.0.0:0` lets Aeron pick the port and announce it over the control
# channel, which is what lets an adapter join without being configured into anything.
discovery.shard.0.executionReportChannel=aeron:udp?endpoint=0.0.0.0:0|control=shard0:20002|control-mode=dynamic
discovery.shard.0.executionReportStreamId=21

discovery.aeronDir=/aeron/driver

# Broadcast on a repeating cycle rather than served on request: an adapter joins, waits at most one
# interval, and is ready. No session state, and a restarted adapter recovers on its own.
discovery.channel=aeron:udp?control=shard0:40000|control-mode=dynamic
discovery.streamId=100
discovery.intervalMs=2000
