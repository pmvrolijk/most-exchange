# The matching engine's node-local config: geometry and capacity only.
#
# Reference prices and collar widths are deliberately absent -- they arrive at runtime as
# SecurityDefinition commands through the replicated log, because every node must apply them at the
# same log position (Design.md §7).

engine.securitiesFile=/config/shard-0-securities.properties

# The same registry the cluster-host authenticates against. The engine never verifies a secret; it
# only turns an already-authenticated principal back into the participants that gateway speaks for.
# Every node must hold an identical copy, which is why the fingerprint is printed at startup.
engine.participantRegistry=/config/shard-0-participants.properties

# The shard's shared media driver, on a tmpfs volume every process on this node mounts. A
# subdirectory of the mount rather than the mount itself: the driver deletes and recreates its
# directory on start, which it cannot do to a mount point.
engine.aeronDir=/aeron/driver

# The consensus module's cluster directory, written by the cluster-host container.
engine.clusterDir=/cluster/cluster

# The book event stream is IPC and stays IPC: market-data is on this node, sharing this driver, and
# putting a shared-memory hop on the network would be paying for nothing.
engine.bookEvent.channel=aeron:ipc
engine.bookEvent.streamId=12

# Hot-path timing (Design.md §2, §7). On in the dev stack because this is where the core is being
# iterated on and a regression should be visible without remembering a flag; off by default in code,
# so a production node opts in. Costs two clock reads per message, four with stages.
#
# It reads System.nanoTime(), which §1 otherwise bans in the engine. That ban is on time influencing
# replicated state, and these histograms are write-only: never read by a decision, never
# snapshotted. MetricsDeterminismTest is the check, not the comment.
engine.metrics=true
engine.metrics.stages=true
engine.metrics.file=/tmp/engine-latency.hgrm

# Back off rather than busy-spin (Design.md §7, "Duty cycle"). A development machine running the whole
# stack cannot give this thread a core of its own, and a spinning one reads ~100% CPU whether it works
# or not. Production leaves this unset, which is busy-spin. With metrics on, how full the thread really
# is is the `duty-ns: engine service` counter: `most counters --match duty --interval-ms 1000`.
engine.idleStrategy=backoff
