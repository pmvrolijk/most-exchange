# Order entry gateway.
#
# Two very different pairs of channels here, and the difference is the whole point of this file:
#
#   ingress/egress    -- the CLUSTER client. Internal to this node.
#   client.inbound/outbound -- what upstream protocol adapters talk to. These are the endpoints
#                        discovery publishes, and the only way into the exchange for anything
#                        outside this node.

gateway.securitiesFile=/config/shard-0-securities.properties
gateway.aeronDir=/aeron/driver

# This gateway's cluster identity. The id is checked against the registry at boot -- a typo stops
# the process here rather than becoming a cluster connection the consensus module refuses with no
# explanation. Wrong credentials are rejected outright and never downgraded to an anonymous
# session: a gateway that connected anonymously would trade perfectly well while losing exactly the
# fills of whichever of its participants had gone quiet.
gateway.participantRegistry=/config/shard-0-participants.properties
gateway.gatewayId=gw-0
# A file rather than a value, so the secret is not one more line in a config file full of endpoints.
gateway.credentialTokenFile=/config/gateway-0.secret

# Every member's ingress endpoint so the client can find the leader. One member here; production
# lists three or five.
gateway.ingressChannel=aeron:udp
gateway.ingressEndpoints=0=shard0:20110
gateway.egressChannel=aeron:udp?endpoint=0.0.0.0:0

# Facing the adapters.
#
# `shard0`, not `gateway`: these endpoints are bound by the MEDIA DRIVER, which runs in the
# cluster-host container and is shared by every process on this node. A driver can only bind
# addresses its own container owns, so the shard has one network identity for all of its Aeron
# traffic -- `shard0` is a network alias for the driver's container. This is not a Docker
# workaround; it is what "these five processes are one node sharing /dev/shm" means once the
# processes are in separate containers.
#
# A plain unicast endpoint for inbound, because the gateway SUBSCRIBES and every adapter publishes
# to it. 0.0.0.0 binds every interface, so `shard0:20001` reaches it.
gateway.client.inbound.channel=aeron:udp?endpoint=0.0.0.0:20001
gateway.client.inbound.streamId=20

# Outbound the gateway PUBLISHES, and there may be many adapters listening. Multicast is the
# production answer and does not survive a Docker bridge, so this uses dynamic MDC: subscribers
# announce themselves on the control address and the publisher adds a destination per subscriber.
# Unicast fan-out, no multicast routing required.
gateway.client.outbound.channel=aeron:udp?control=shard0:20002|control-mode=dynamic
gateway.client.outbound.streamId=21

# There is deliberately nothing here about order state. The gateway holds none: origQty and cumQty
# are stated by the engine on every execution report (Design.md §3.1), so restarting this container
# loses nothing and several gateways can serve one shard.

# Hot-path timing for both legs (Design.md §2). See engine.properties for the rationale; the
# gateway is not a replicated state machine, so it carries none of the determinism argument.
gateway.metrics=true
gateway.metrics.file=/tmp/gateway-latency.hgrm
