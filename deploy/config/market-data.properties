# Market data: consumes the book event stream, derives L1/L2 and forwards L3 verbatim.
#
# Separate process so feed fan-out never touches the matching thread, and the engine never formats
# market data (Design.md §5).

md.securitiesFile=/config/shard-0-securities.properties
md.aeronDir=/aeron/driver

# In from the engine, over this node's shared memory.
md.bookEvent.channel=aeron:ipc
md.bookEvent.streamId=12

# Out to subscribers, by dynamic MDC. The control addresses are on `shard0` -- the shared media
# driver's container -- not on this process's, because the driver binds them. Dynamic MDC for the
# same reason the gateway's outbound leg uses it: a
# Docker bridge does not route multicast. Production publishes these as multicast and must keep
# MaxMulticastFlowControl -- the fastest receiver governs, so a slow subscriber takes a gap rather
# than throttling the publisher (Design.md §5).
md.l1.channel=aeron:udp?control=shard0:40001|control-mode=dynamic
md.l1.streamId=1
md.l2.channel=aeron:udp?control=shard0:40002|control-mode=dynamic
md.l2.streamId=2
# L3 is the raw book event stream forwarded byte for byte, and the only feed on which a volatility
# halt is visible -- which is why the control plane subscribes to this one and not to L1 or L2.
md.l3.channel=aeron:udp?control=shard0:40003|control-mode=dynamic
md.l3.streamId=3
# The L2 recovery feed: a full image of one book per slice, so a subscriber that joins mid-session
# has something to apply the incremental updates to. One security per slice, so a whole pass takes
# the cycle below however many books the shard hosts -- and that pass is what a joiner waits.
md.snapshot.channel=aeron:udp?control=shard0:40004|control-mode=dynamic
md.snapshot.streamId=4
md.snapshot.cycleMs=1000
