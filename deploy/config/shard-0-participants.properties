# Which gateway speaks for which participant on shard 0 (Design.md §1).
#
# Read by TWO processes, for two different reasons. The cluster-host's consensus module
# authenticates a connecting gateway against the secret below and stamps its id on the session as
# the encoded principal; the engine resolves that principal back to this participant list at
# session open and binds every one of them. That is what makes a participant reachable when it has
# said nothing since the gateway last connected -- a gateway restart, most of all.
#
# The value here is the SHA-256 of the shared secret, not the secret. The secret itself lives in
# gateway-0.secret and is mounted only into the gateway. In a dev stack both are in the repository,
# which is fine for a dev stack and is not how a real one is run.
#
# Hand-written for the dev stack, as shard-0-securities.properties is. The control plane renders
# this file now -- POST /api/gateways, then publish a release -- so a real deployment points at
# releases/NNNNNN/shard-0-participants.properties instead of at this.
#
# The node processes and the gateway all re-read whatever path they are given, every five seconds by
# default, so changing who speaks for whom costs no restart at all (deploy/README.md).
shard.id=0
registry.gateways=gw-0
gateway.gw-0.secret=3b2c637a03bcb9c167c9bd5f84de22f6bbdc18169d36526cafc164cd68725367
# 7 and 8 are the two the README trades with; 20-23 are what `most load` sends as. The gateway
# rejects any other participant, and forwards the CLI's operator commands only because it is an
# operator (Design.md §1, "Enforcement, at the gateway").
gateway.gw-0.participants=7,8,20,21,22,23
gateway.gw-0.operator=true
