# Shard 0's security list -- identity and geometry, read at boot by the engine, the gateway, the
# market-data process and discovery alike. Every process prints its fingerprint at startup; they
# must agree, which is why this is one mounted file rather than four copies.
#
# In a real deployment this file is *published* by the control plane as part of a numbered release,
# not hand-written. The dev stack seeds the control plane from this same file (deploy/init/seed.sh
# imports it), so the database and the running shard describe the same universe by construction
# rather than by anyone remembering to keep them in step.

