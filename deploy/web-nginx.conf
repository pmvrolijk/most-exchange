server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # One origin. Everything under /api is the control plane; everything else is the SPA.
    location /api/ {
        proxy_pass http://control:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The audit records the caller's address, so the proxy must not make every operator look
        # like it. Set CONTROL_FORWARD_HEADERS=true for the control plane to trust these.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A client-side router owns every other path: a deep link like /audit is not a file, and must
    # return the shell rather than a 404 for a reload or a bookmark to work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
