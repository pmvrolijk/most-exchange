# Shard registry. Discovery derives the tradable universe from the shards' OWN security files, so
# the published directory and the running engines cannot describe different geometry.
#
# The invariant it enforces: a security is served by exactly one shard. Books are independent and
# nothing matches across shards, so a security on two shards would give clients two disjoint books
# under one identifier with no error anywhere to say so.

discovery.shards=1,2

discovery.shard.1.securitiesFile=/etc/most-exchange/shard-1-securities.properties
discovery.shard.1.ingressChannel=aeron:udp?endpoint=shard1:9010
discovery.shard.1.egressChannel=aeron:udp?endpoint=shard1:9020

discovery.shard.2.securitiesFile=/etc/most-exchange/shard-2-securities.properties
discovery.shard.2.ingressChannel=aeron:udp?endpoint=shard2:9010
discovery.shard.2.egressChannel=aeron:udp?endpoint=shard2:9020

# discovery.aeronDir=/dev/shm/aeron

# Broadcast on a repeating cycle rather than served on request: an adapter joins, waits at most one
# interval, and is ready. No session state, and a restarted adapter recovers on its own.
discovery.channel=aeron:udp?endpoint=239.10.0.1:40000
discovery.streamId=100
discovery.intervalMs=5000
