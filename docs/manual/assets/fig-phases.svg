<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#14181f"/>
    </marker>
    <marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a2540"/>
    </marker>
  </defs>
  <style>
    .st{fill:#fff;stroke:#14181f;stroke-width:1.4}
    .n{font-size:11.5px;fill:#14181f;font-weight:600;font-family:Menlo,monospace}
    .s{font-size:9.5px;fill:#4a5260}
    .e{stroke:#14181f;stroke-width:1.3;fill:none;marker-end:url(#p)}
    .er{stroke:#7a2540;stroke-width:1.3;fill:none;marker-end:url(#pr);stroke-dasharray:5 3}
    .el{font-size:9.5px;fill:#4a5260;font-family:Menlo,monospace}
    .erl{font-size:9.5px;fill:#7a2540}
  </style>

  <rect x="20" y="60" width="130" height="46" rx="4" class="st"/>
  <text x="85" y="80" class="n" text-anchor="middle">CLOSED</text>
  <text x="85" y="96" class="s" text-anchor="middle">orders rejected</text>

  <rect x="205" y="60" width="130" height="46" rx="4" class="st"/>
  <text x="270" y="80" class="n" text-anchor="middle">PRE_OPEN</text>
  <text x="270" y="96" class="s" text-anchor="middle">book, no match</text>

  <rect x="390" y="60" width="140" height="46" rx="4" class="st"/>
  <text x="460" y="80" class="n" text-anchor="middle">OPEN_AUCTION</text>
  <text x="460" y="96" class="s" text-anchor="middle">book, no match</text>

  <rect x="585" y="60" width="150" height="46" rx="4" class="st"/>
  <text x="660" y="80" class="n" text-anchor="middle">CONTINUOUS</text>
  <text x="660" y="96" class="s" text-anchor="middle">book and match</text>

  <path class="e" d="M150,83 L201,83"/>
  <path class="e" d="M335,83 L386,83"/>
  <path class="e" d="M530,83 L581,83"/>
  <text x="600" y="32" class="el" text-anchor="middle">the uncross runs on this transition only</text>
  <path class="e" d="M600,40 L600,56"/>

  <path class="e" d="M660,110 C660,148 300,158 92,116"/>
  <text x="380" y="152" class="el" text-anchor="middle">CLOSED is a single step from anywhere — nothing is computed on the way down</text>

  <path class="er" d="M600,110 C560,200 220,208 98,124"/>
  <text x="352" y="232" class="erl" text-anchor="middle">volatility halt: one security to CLOSED, resting book intact, no automatic recovery</text>
</svg>
