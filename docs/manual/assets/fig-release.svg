<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="q" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5260"/>
    </marker>
  </defs>
  <style>
    .box{fill:#fff;stroke:#14181f;stroke-width:1.3}
    .t{font-size:11.5px;fill:#14181f;font-weight:600}
    .s{font-size:9.5px;fill:#4a5260}
    .m{font-size:9px;fill:#4a5260;font-family:Menlo,monospace}
    .ln{stroke:#4a5260;stroke-width:1.2;fill:none;marker-end:url(#q)}
    .x{stroke:#7a2540;stroke-width:1.3;fill:none;stroke-dasharray:5 3}
    .xl{font-size:9.5px;fill:#7a2540}
  </style>

  <rect x="14" y="70" width="130" height="60" rx="4" class="box"/>
  <text x="79" y="94" class="t" text-anchor="middle">Postgres</text>
  <text x="79" y="110" class="s" text-anchor="middle">the draft topology</text>
  <text x="79" y="123" class="s" text-anchor="middle">(editable)</text>

  <rect x="196" y="70" width="150" height="60" rx="4" class="box"/>
  <text x="271" y="94" class="t" text-anchor="middle">POST /api/releases</text>
  <text x="271" y="110" class="s" text-anchor="middle">validate with the domain's</text>
  <text x="271" y="123" class="s" text-anchor="middle">own objects, then freeze</text>

  <rect x="392" y="46" width="196" height="108" rx="4" class="box"/>
  <text x="490" y="68" class="t" text-anchor="middle">releases/000042/</text>
  <text x="402" y="88" class="m">shard-0-securities.properties</text>
  <text x="402" y="103" class="m">shard-0-participants.properties</text>
  <text x="402" y="118" class="m">discovery.properties</text>
  <text x="402" y="133" class="m">engine/gateway/market-data</text>
  <text x="402" y="147" class="m">manifest.json</text>

  <rect x="630" y="46" width="116" height="108" rx="4" class="box"/>
  <text x="688" y="70" class="t" text-anchor="middle">The five</text>
  <text x="688" y="85" class="t" text-anchor="middle">processes</text>
  <text x="688" y="106" class="s" text-anchor="middle">read files at boot,</text>
  <text x="688" y="119" class="s" text-anchor="middle">never the database</text>
  <text x="688" y="140" class="m" text-anchor="middle">via `current`</text>

  <path class="ln" d="M144,100 L192,100"/>
  <path class="ln" d="M346,100 L388,100"/>
  <path class="ln" d="M588,100 L626,100"/>

  <path class="x" d="M79,134 C79,196 500,206 688,158"/>
  <line x1="372" y1="182" x2="392" y2="202" class="x" stroke-dasharray="0"/>
  <line x1="392" y1="182" x2="372" y2="202" class="x" stroke-dasharray="0"/>
  <text x="380" y="228" class="xl" text-anchor="middle">never: a database outage must not stop a node starting, and a write landing between two boots would give them different geometry</text>
</svg>
