# Order entry gateway configuration.
#
# Both legs speak binary SBE. Protocol gateways that translate FIX or a proprietary session
# protocol sit upstream of this process, outside this project (Design.md §1).

# Securities this shard hosts, from the shard's own security file. Orders for anything else are
# rejected here rather than spending a cluster round trip and a slot in the replicated log.
#
# Upstream protocol adapters learn which shard serves which symbol from the discovery broadcast,
# so they can send each order to the right gateway in the first place.
gateway.securitiesFile=/etc/most-exchange/shard-1-securities.properties

# gateway.aeronDir=/dev/shm/aeron

# Cluster client channels.
gateway.ingressChannel=aeron:udp?endpoint=localhost:9010
gateway.egressChannel=aeron:udp?endpoint=localhost:9020

# Facing the upstream protocol gateways.
gateway.client.inbound.channel=aeron:ipc
gateway.client.inbound.streamId=20
gateway.client.outbound.channel=aeron:ipc
gateway.client.outbound.streamId=21
