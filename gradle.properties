org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m

kotlin.code.style=official

# Native image target architecture. Design.md §7 requires this pinned explicitly for
# production builds (-march=native SIGILLs when the build host differs from prod).
# Leave unset for local builds on a different architecture; CI must set it.
# engine.march=x86-64-v3

# Epsilon GC is the eventual target, not the initial setting (Design.md §7 staged adoption).
engine.useEpsilonGc=false
