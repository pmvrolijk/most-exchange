[versions]
kotlin = "2.4.10"
aeron = "1.53.0"
agrona = "2.6.0"
sbe = "1.40.1"
junit = "6.1.3"
hdrhistogram = "2.2.2"
spring-boot = "3.5.6"
flyway = "11.10.0"
postgresql = "42.7.7"
testcontainers = "1.21.3"
graalvm-buildtools = "1.1.11"

[libraries]
aeron-all = { module = "io.aeron:aeron-all", version.ref = "aeron" }
# The adapter SDK's Aeron dependency, as its published POM declares it. Inside this build it is
# substituted with aeron-all (root build.gradle.kts), so every process runs on one copy of Aeron.
aeron-client = { module = "io.aeron:aeron-client", version.ref = "aeron" }
agrona = { module = "org.agrona:agrona", version.ref = "agrona" }
sbe-tool = { module = "uk.co.real-logic:sbe-tool", version.ref = "sbe" }
hdrhistogram = { module = "org.hdrhistogram:HdrHistogram", version.ref = "hdrhistogram" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "spring-boot" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc", version.ref = "spring-boot" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation", version.ref = "spring-boot" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security", version.ref = "spring-boot" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "spring-boot" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version = "1.1.7" }
graalvm-native = { id = "org.graalvm.buildtools.native", version.ref = "graalvm-buildtools" }
