# The shard's securities. Read by the engine, the gateway AND the market data process, so a shard
# has one security list rather than three that must be kept in step by hand. Discovery reads it too,
# which is why the published directory cannot disagree with what the engines actually run.
#
# Every process prints a fingerprint of this file at startup. Compare it across cluster nodes and
# across processes: geometry decides how a price maps to a ladder level, so a mismatch diverges the
# books rather than failing loudly.
#
# Not here: reference prices and collar widths. Those change during a session and arrive as
# SecurityDefinition commands through the replicated log (Design.md §4.4).

shard.id=1
shard.securities=1,2

# Prices are fixed-point with 8 implied decimals: 1000000 == 0.01
security.1.symbol=AAPL
security.1.isin=US0378331005
security.1.name=Apple Inc.
security.1.currency=USD
security.1.priceFloor=0
security.1.tickSize=1000000
security.1.levelCount=65536
security.1.maxOrders=1000000

security.2.symbol=MSFT
security.2.isin=US5949181045
security.2.name=Microsoft Corporation
security.2.currency=USD
security.2.priceFloor=0
security.2.tickSize=1000000
security.2.levelCount=65536
security.2.maxOrders=1000000
